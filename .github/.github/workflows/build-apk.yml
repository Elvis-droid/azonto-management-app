name: Build Android APK

# This workflow builds an Android APK in the cloud using Expo's EAS Build
# service, so you don't need Android Studio installed locally.
#
# SETUP REQUIRED:
# 1. Create a free account at https://expo.dev
# 2. Generate an access token: https://expo.dev/accounts/[your-account]/settings/access-tokens
# 3. In your GitHub repo, go to Settings > Secrets and variables > Actions
#    and add a new secret named EXPO_TOKEN with that token's value.
# 4. Run "eas build:configure" once locally (or update app.json's
#    extra.eas.projectId) to link this project to your Expo account.
#
# Trigger this workflow manually from the "Actions" tab, or it will run
# automatically whenever you push to the main branch.

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK
        run: eas build --platform android --profile preview --non-interactive
